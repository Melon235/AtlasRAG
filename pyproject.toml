[project]
name = "atlasrag"
version = "0.0.0"
description = "Repository foundation for the architecture-governed AtlasRAG platform."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.19.0,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.16.4,<0.17.0",
]

[build-system]
requires = ["setuptools>=83.0.0,<84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlasrag*"]
namespaces = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src/atlasrag"]
